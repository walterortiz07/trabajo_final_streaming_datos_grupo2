[project]
name = "contact-center-streaming"
version = "1.0.0"
description = "Proyecto integrador — analítica de contact center en tiempo real con Kafka y Apache Beam"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "apache-beam==2.74.0",
  "betterproto==2.0.0b6",
  "confluent-kafka>=2.8,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contact_center"]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: requiere el stack de Docker Compose"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Beam inyecta StateParam, TimerParam y WindowParam por parámetros por defecto.
"src/contact_center/transforms.py" = ["B008"]
